name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout zippey
        uses: actions/checkout@v4
        with:
          repository: rockstorm101/zippey
          path: zippey

      - name: Mkdir
        run: mkdir .build

      - name: Decode
        run: python zippey/zippey.py decode < case.FCStd > .build/case.FCStd

      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: case-${{ github.ref_name }}
          path: .build/case.FCStd

      - name: Rename
        run: mv .build/case.FCStd .build/case-${{ github.ref_name }}.FCStd

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: mikepenz/action-gh-release@v1
        with:
          body: ${{steps.build_changelog.outputs.changelog}}
          files: |
            .build/case-${{ github.ref_name }}.FCStd
